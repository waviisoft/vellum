# Backref from this product repo to the intent repo that governs it.
# One intent repo governs one or more product repos; each product repo answers
# to exactly one intent repo (spec/features/repo-topology.md).

intent:
  repo: waviisoft/vellum-intent
  url: https://github.com/waviisoft/vellum-intent

# The pin of record (spec/decisions/2026-08-28-pin-file.md). This file IS the
# pin: `commit` is the spec version this code implements, and build and CI
# fetch the spec tree at it. No submodule or subtree is mounted here any more;
# an installation may keep one as a developer convenience, but nothing treats a
# gitlink as authoritative and nothing requires one to exist.
#
# `name` is decoration (spec/decisions/2026-08-28-versions-are-commits.md).
# Nothing reads it to decide anything, so it may be absent, late or wrong
# without changing behavior — a commit that carries no `spec-v*` tag simply has
# no name yet. This pin is the spec version current when the extract-fails-
# loud wave closed; its decorative name arrives when the intent workflow tags it.
#
pin:
  commit: 81229b84006e43989afd50a2d1ee981121c3422c
  name: null

# This repo's entry in the intent repo's .vellum/workspace.yaml.
product:
  name: core
  trees: [src, .vellum/memory]

# Trees an implementer may write in this repo. harness/ and the ledger are out
# of bounds (spec/behaviors/write-boundaries.md). The spec tree is no longer a
# checkout fact here — nothing mounts it — so that boundary is now the plain
# one it always was for the intent repo: implementers hold no intent-repo
# credentials (spec/features/repo-topology.md, least authority).
# `.github/workflows/` joined the implementer's trees with the installer wave
# (spec/features/installation.md): the adapter logic ships from here as
# reusable workflows, so they are product code an implementer maintains.
#
# `pyproject.toml` and `LICENSE` joined them with the go-live wave. Both are
# packaging metadata for the code an implementer already owns — the licence
# declaration, its file, and the build requirements that declaration needs —
# and neither is anybody else's tree. They are named individually rather than
# by widening the boundary to the repository root: a root entry would put
# `.vellum/product.yaml` itself, and this very block, inside the implementer's
# reach, which is the one edit this guard exists to make somebody argue for.
write_boundaries:
  implementer: [src, tests, .vellum/memory, adapters, README.md, .github/workflows, pyproject.toml, LICENSE]

# The spec-first guard and the certification runner arrive in v0.2
# (docs/design.md section 10); nothing in this repo enforces them yet.
