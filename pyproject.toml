[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vellum"
version = "0.1.0"
description = "Spec-driven product engineering tooling: lint, suite extraction, ledger."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0,<7",
    "gherkin-official>=29,<43",
]

[project.scripts]
vellum = "vellum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
