# CI for THIS repo (the product repo). Distinct from the three `workflow_call`
# workflows beside it — `spec-ci.yml`, `on-spec-merge.yml`, `harness-ci.yml` —
# which hold the logic an INTENT repo's caller stubs invoke and never run for
# this repo: they have no trigger but `workflow_call`. This one is the
# product repo's own tests and conformance check.
#
# Runners: this organisation schedules Actions on Blacksmith, not on
# GitHub-hosted runners. `runs-on: ubuntu-latest` is never assigned a runner
# here — the job is accepted and then fails in a few seconds with no logs, no
# steps and runner_id 0, which reads like an infrastructure blip and is not
# one. Use a `blacksmith-<vcpu>vcpu-ubuntu-<release>` label. Sizes run 2-32
# vCPU; 2 is right for this repo, whose slowest job is a few seconds of
# unittest.
#
# The pin of record is `.vellum/product.yaml` (spec/decisions/2026-08-28-pin-file.md);
# there is no spec submodule any more. The intent repo is private, and a
# workflow's default GITHUB_TOKEN is scoped to this repository alone — it
# cannot clone it. So the tests run without the spec tree (they are written to
# skip the handful of checks that need it), and the conformance job fetches the
# intent repo explicitly, at the pin, with a credential that can read it.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: blacksmith-2vcpu-ubuntu-2204
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and a current release.
        python: ['3.10', '3.12']
    steps:
      # No spec tree: the suite uses fixture trees and throwaway git repos it
      # builds itself. The tests that assert against the pinned tree skip
      # themselves when VELLUM_INTENT_REPO is unset, and the conformance job
      # covers them.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install --quiet -e .

      - name: Tests
        run: PYTHONPATH=tests python -m unittest discover -s tests -t tests

  conformance:
    name: The pinned spec lints and extracts correctly
    runs-on: blacksmith-2vcpu-ubuntu-2204
    env:
      # A token that can read the intent repo. `secrets` is not available in a
      # step-level `if`, so it is lifted into the environment and tested there.
      SPEC_TOKEN: ${{ secrets.SPEC_TOKEN }}
      # Where the tests find the intent checkout, now that nothing mounts it.
      VELLUM_INTENT_REPO: ${{ github.workspace }}/intent
    steps:
      - uses: actions/checkout@v4

      - name: Is a spec credential configured?
        id: cred
        run: |
          if [ -n "$SPEC_TOKEN" ]; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi

      # =================================================================
      # Without SPEC_TOKEN this job cannot read the pinned spec, so it
      # reports that plainly instead of passing as though it had checked.
      # =================================================================
      - name: Conformance NOT VERIFIED (no SPEC_TOKEN)
        if: steps.cred.outputs.available != 'yes'
        run: |
          echo "::warning title=Conformance not verified::SPEC_TOKEN is not set, so the pinned spec was not checked. See .github/workflows/ci.yml."
          {
            echo "### Conformance not verified"
            echo
            echo "\`SPEC_TOKEN\` is not configured, so this job could not read the"
            echo "private intent repo and **did not check the pin**. The tests still ran."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the pin
        if: steps.cred.outputs.available == 'yes'
        id: pin
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import pathlib, yaml
          pin = yaml.safe_load(pathlib.Path(".vellum/product.yaml").read_text())["pin"]
          print(f"commit={pin['commit']}")
          print(f"name={pin.get('name') or ''}")
          PY

      - name: Fetch the intent repo
        if: steps.cred.outputs.available == 'yes'
        uses: actions/checkout@v4
        with:
          repository: waviisoft/vellum-intent
          token: ${{ secrets.SPEC_TOKEN }}
          path: intent
          # A version is a commit and dating walks main's history, so the
          # history IS the data. A shallow clone truncates it and re-dates
          # every scenario below the graft — forward, which is the dangerous
          # direction. `vellum suite extract` reports `shallow: true` and the
          # check below fails on it, but do not rely on that: fetch it all.
          fetch-depth: 0

      - name: Move the intent checkout to the pin
        if: steps.cred.outputs.available == 'yes'
        # Through `env`, never `${{ }}` inside the script — the same rule the
        # two steps below already follow, and the one step that most needed it.
        # `${{ }}` pastes its value into the script *before* the shell parses
        # the line, so a pin carrying a quote and a `;` runs as this step's own
        # code on a job holding SPEC_TOKEN, a credential that reads the private
        # intent repo. And `pin.commit` is not typed here: it is read out of
        # `.vellum/product.yaml`, which `vellum pin advance` writes from a
        # ledger record in the intent repo — attacker-writable by anyone who
        # can land a merge there. As an `env` value it is data the shell reads
        # out of the environment, never source it executes.
        env:
          PIN: ${{ steps.pin.outputs.commit }}
        run: |
          git -C intent checkout --quiet --detach "$PIN"
          git -C intent log --oneline -1

      - uses: actions/setup-python@v5
        if: steps.cred.outputs.available == 'yes'
        with:
          python-version: '3.12'

      - name: Install
        if: steps.cred.outputs.available == 'yes'
        run: pip install --quiet -e .

      - name: vellum lint
        if: steps.cred.outputs.available == 'yes'
        run: vellum lint intent/

      - name: vellum suite extract
        if: steps.cred.outputs.available == 'yes'
        run: vellum suite extract intent/ --output suite.json

      # The pinned-tree tests are the ones the `test` job skips. Running them
      # here with VELLUM_INTENT_REPO set is what stops that skip from being a
      # silent hole: they assert the extraction against oracles read from the
      # tree itself.
      - name: Tests against the pinned tree
        if: steps.cred.outputs.available == 'yes'
        run: PYTHONPATH=tests python -m unittest discover -s tests -t tests

      # The definition of done, asserted rather than asserted-about: the
      # checkout is at its pin, every scenario is dated by a commit in that
      # ancestry, and nothing is pending. This is what makes "this checkout
      # conforms to its pin" a checked property.
      - name: Check the suite against the pin
        if: steps.cred.outputs.available == 'yes'
        env:
          PIN: ${{ steps.pin.outputs.commit }}
        run: |
          python - <<'PY'
          import json, os, sys

          suite = json.load(open("suite.json"))
          pin = os.environ["PIN"]

          problems = []
          if suite["spec_version"] != pin:
              problems.append(
                  f"the suite extracted at {suite['spec_version']}, "
                  f"but .vellum/product.yaml pins {pin}"
              )
          if suite["shallow"]:
              problems.append("the intent checkout is shallow; scenario dating is unreliable")
          missing = sorted({s["file"] for s in suite["scenarios"] if not s["id"]})
          if missing:
              problems.append(f"{len(missing)} file(s) with an id-less scenario: {missing}")
          ids = [s["id"] for s in suite["scenarios"]]
          if len(ids) != len(set(ids)):
              problems.append("duplicate scenario ids in the suite")
          pending = [s["id"] for s in suite["scenarios"] if s["pending"]]
          if pending:
              problems.append(f"scenarios carried by no commit in the pin's ancestry: {pending}")

          for problem in problems:
              print(f"::error title=Conformance::{problem}")
          versions = sorted({(s["version_name"] or (s["version"] or "?")[:8])
                             for s in suite["scenarios"]})
          print(
              f"{suite['scenario_count']} scenarios, versions {versions}, "
              f"pin {pin[:12]} ({suite['spec_version_name'] or 'unnamed'})"
          )
          sys.exit(1 if problems else 0)
          PY

      # =================================================================
      # Divergence is REPORTED, never failed on
      # (spec/features/repo-topology.md at spec-v8): conformance CI's job is
      # the checkout against its pin, and a red that fires on every spec merge
      # — on every branch, including the base — trains people to ignore red.
      # The backpressure on divergence acts at spec approval, not here.
      # =================================================================
      - name: Report divergence from spec-head
        if: steps.cred.outputs.available == 'yes'
        # A report that can fail the job is not a report. If the fetch or the
        # comparison breaks, say nothing and stay green: the pin assertion
        # above is the check, this step is the summary beside it.
        continue-on-error: true
        env:
          PIN: ${{ steps.pin.outputs.commit }}
        run: |
          git -C intent fetch --quiet origin main || true
          head="$(git -C intent rev-parse origin/main 2>/dev/null || true)"
          if [ -z "$head" ]; then
            echo "::notice title=Divergence not checked::could not resolve the intent repo's main"
            exit 0
          fi
          if [ "$head" = "$PIN" ]; then
            echo "### Pin is at spec-head" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${PIN:0:12}\` is the intent repo's \`main\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git -C intent merge-base --is-ancestor "$PIN" "$head"; then
            behind="$(git -C intent rev-list --first-parent --count "$PIN..$head" -- spec)"
            echo "::notice title=Pin behind spec-head::${behind} spec version(s) have landed since the pin; this is divergence to report, not a failure."
            {
              echo "### Pin is ${behind} spec version(s) behind spec-head"
              echo
              echo "| | commit |"
              echo "|---|---|"
              echo "| pin | \`${PIN:0:12}\` |"
              echo "| spec-head | \`${head:0:12}\` |"
              echo
              echo "Divergence is reported here and acted on at spec approval"
              echo "(\`spec/features/repo-topology.md\`). It is **not** a failure of this repo."
              echo
              git -C intent log --first-parent --oneline "$PIN..$head" -- spec | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Pin is not on main::the pin is not an ancestor of spec-head — expected while an approved spec PR is held for paired landing."
            {
              echo "### Pin is not an ancestor of spec-head"
              echo
              echo "\`${PIN:0:12}\` is not on the intent repo's \`main\`. Under paired landing"
              echo "(\`spec/decisions/2026-08-28-paired-landing.md\`) that is the expected shape"
              echo "while an approved spec PR is held, and is reported rather than failed on."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.cred.outputs.available == 'yes'
        with:
          name: suite
          path: suite.json
