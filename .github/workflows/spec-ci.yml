# Spec CI — the REUSABLE workflow behind every installation's `spec-ci` stub.
#
# This file holds the logic and lives here, in the product repo, because a
# `workflow_call` workflow is the forge's own answer to "ship once, install
# thin" (spec/features/installation.md, issue waviisoft/vellum-intent#23). An
# intent repo carries a caller stub — `adapters/github/spec-ci.yml`, stamped by
# `vellum init` — naming this file at a pinned ref, and passing VELLUM_TOKEN if
# it has one to pass: that secret is optional (see `secrets:` below). The stub
# holds no logic, so it has nothing to drift; upgrading an installation is
# bumping the ref in the stub.
#
# THIS FILE NEVER RUNS FOR THIS REPO. It has no trigger of its own: `on:` is
# `workflow_call` and nothing else, so `waviisoft/vellum`'s own PRs and pushes
# do not start it. `.github/workflows/ci.yml` is the workflow that tests this
# repo, and it is a separate file with separate behaviour.
#
# `actions/checkout` with no `repository:` checks out the CALLER — the intent
# repo, at the commit that triggered the caller's run. That is what every step
# below wants: the spec tree, the ledger and the config it reads are the
# installation's, not this repo's. The one checkout of THIS repo is the CLI
# checkout, which names `waviisoft/vellum` and `inputs.vellum-ref` explicitly.
#
# Runners are Blacksmith (`blacksmith-2vcpu-ubuntu-2204`). That is a hosting
# choice made by WAVIISoft, the organisation that publishes this repo, and not
# a property of Vellum: WAVIISoft routes Actions through Blacksmith, so
# `ubuntu-latest` is never assigned a runner there and a job that asks for one
# is accepted and then fails in seconds with no logs. An installation in an
# organisation without Blacksmith must run these jobs on labels of its own, and
# today that means forking this repo and editing the label, because the label
# lives in this file and no input overrides it. See adapters/github/README.md,
# where the limit and the fix are stated in full.
#
# Implements spec/features/spec-pipeline.md: "Spec CI runs on every spec PR:
# lint ..., coherence review (agent), coverage review (agent), and an impact
# report (agent)." Only lint and extraction are real in v0.1; the three agent
# reviews are stubs, marked below.

name: spec-ci

# Triggers live in the CALLER's stub, not here: `pull_request` with the paths
# this pipeline reads, so a PR that raises `divergence_cap` or adds unshipped
# versions re-runs the gate that reads them. `concurrency` lives there too — a
# group is scoped to the repository whose runs it serialises, and two
# installations must never share one.
on:
  workflow_call:
    inputs:
      vellum-ref:
        description: >-
          The ref of waviisoft/vellum the CLI is checked out and installed
          from. Stamped by `vellum init` to the same ref the stub pins this
          file at, so one installation runs one version of the CLI and one
          version of the workflow around it; `vellum doctor` reports when the
          two have come apart.
        required: true
        type: string
    secrets:
      VELLUM_TOKEN:
        description: >-
          A token that can read waviisoft/vellum, the repo the CLI is installed
          from. OPTIONAL: `required: false`, because once that repo is public
          the caller's own `github.token` reads it and an installation that
          passes nothing here still runs. Supply it while the repo is private,
          or to reach a fork that is not public. When it IS passed it is passed
          BY NAME — a stub never uses `secrets: inherit`, so this workflow holds
          exactly the credential its jobs name and nothing else in the
          installation (spec/features/installation.md).
        required: false

# Granted by the caller and consumed here. A called workflow's token can only
# be narrowed by the callee, never widened, so the stub grants
# `contents: read` plus the `pull-requests: write` the agent-review job asks
# for, and these lines can only take away from that.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and extract the suite
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - name: Check out the spec
        uses: actions/checkout@v4
        with:
          # Full history: a version is a commit and `vellum suite extract` dates
          # each scenario by walking main's spec-touching commits, so the
          # history IS the data. A shallow clone truncates it and re-dates every
          # scenario below the graft — forward, which is the direction that arms
          # scenarios the product already satisfies. `suite.json` reports
          # `shallow: true` when this is wrong and the summary step below fails
          # the job on it — a backstop for this line, not a substitute for it.
          fetch-depth: 0
          # This checkout never pushes, so the credential has no reason to
          # outlive it in `.git/config`.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A NOTICE, NOT A GATE — this step used to `exit 1` on an empty secret.
      # VELLUM_TOKEN is optional now: the CLI checkout below falls back to the
      # caller's own `github.token`, which reads waviisoft/vellum once that repo
      # is public. What is left worth saying is WHICH of the two the run used,
      # because a checkout that 404s against a repo that is still private is
      # otherwise an opaque failure two steps further down.
      #
      # The secret reaches this body through `env:` and is only ever tested for
      # emptiness — never echoed, never interpolated. `required: false` does not
      # make this step redundant: it catches a caller that omits the key, and
      # never an empty one, which is the case this reports.
      - name: Say whether VELLUM_TOKEN was supplied
        env:
          VELLUM_TOKEN: ${{ secrets.VELLUM_TOKEN }}
        run: |
          if [ -z "$VELLUM_TOKEN" ]; then
            echo "::notice title=No VELLUM_TOKEN::no VELLUM_TOKEN — checking out waviisoft/vellum without a token; this works once the repo is public"
          else
            echo "VELLUM_TOKEN was supplied; the CLI checkout uses it rather than the caller's github.token."
          fi

      # Checked out rather than pip-installed from the git URL. Two reasons are
      # now spent: pip's VCS install recursively initialized the private spec
      # submodule and failed (that submodule is gone —
      # spec/decisions/2026-08-28-pin-file.md), and a private waviisoft/vellum
      # needed a credential `pip install "vellum @ git+https://..."` has nowhere
      # to put. What keeps the checkout is that it takes a ref directly, so the
      # `vellum-ref` input pins the CLI in one obvious place, and that it is the
      # one shape that works whether or not a token is supplied.
      - name: Check out the vellum CLI
        uses: actions/checkout@v4
        with:
          repository: waviisoft/vellum
          ref: ${{ inputs.vellum-ref }}
          # The secret when the caller passed one, the caller's own job token
          # otherwise. `actions/checkout` reads `token` as a REQUIRED input, so
          # an empty value is not "fall back to the default" — it is
          # "Input required and not supplied", before the clone is attempted.
          # The `||` supplies the default explicitly. It is written here, in
          # `with:`, rather than as two checkout steps with opposite `if:`
          # conditions, because the `secrets` context is not available in an
          # `if:` at all — that shape needs the secret laundered through a step
          # output first, and a mis-set output silently runs both checkouts or
          # neither. Both values are registered as secrets and masked in the log.
          token: ${{ secrets.VELLUM_TOKEN || github.token }}
          path: vellum-cli
          # Nothing in this workflow pushes, and this job's workspace root is
          # a pull request's merged tree, so whichever credential the line above
          # resolved to should not be left sitting in `.git/config`. That is
          # true of the caller's own `github.token` as much as of VELLUM_TOKEN.
          persist-credentials: false

      - name: Install the vellum CLI
        run: pip install --quiet ./vellum-cli

      # spec/features/spec-pipeline.md: "Spec CI failure blocks merge exactly as
      # failing tests block a code PR." A non-zero exit here fails the check.
      - name: vellum lint
        run: vellum lint spec/

      - name: vellum suite extract
        run: vellum suite extract spec/ --output suite.json

      # "Introduced or changed by this PR" is the set dated at the head being
      # extracted, not `pending`. Under tags, a scenario no tag carried was
      # pending and that stood in for "new in this PR"; under ancestry the PR's
      # own head is a version, so its scenarios are dated at it and `pending`
      # narrows to genuinely uncommitted content — which on a CI checkout is
      # nothing. The version comparison is the direct question, and it no
      # longer quietly includes every merged-but-unnamed commit.
      #
      # `shallow: true` fails the job, it does not merely annotate it. Product
      # CI already treats shallowness as a conformance failure (.github/
      # workflows/ci.yml, "Check the suite against the pin"), and for the same
      # reason: the dating is wrong in the direction that arms scenarios the
      # product already satisfies. A note in the step summary is not a check —
      # a dropped `fetch-depth: 0` would leave this job green with every
      # scenario below the graft re-dated, which is precisely the silent
      # mis-dating the `fetch-depth: 0` comment above exists to prevent.
      #
      # The summary is written to $GITHUB_STEP_SUMMARY by hand rather than by
      # redirecting stdout, so that stdout stays free for the `::error`
      # annotation the failure needs.
      #
      # STILL A LOGIC BODY, DELIBERATELY — one of two left across these three
      # workflows (the other is issue filing in on-spec-merge.yml). It is not one of the three
      # commands spec/features/spec-pipeline.md names as absorbing the workflow
      # bodies, and the shape it would take — a reporting flag on `vellum suite
      # extract` — is CLI surface no spec change has asked for. It reads
      # `suite.json`, which the command already emits; it invents nothing and
      # decides nothing the CLI has not already decided.
      - name: Summarise the suite
        run: |
          python - <<'PY'
          import json, os, sys

          suite = json.load(open("suite.json"))
          head = suite["spec_version"]
          changed = [s for s in suite["scenarios"] if s["version"] == head]

          lines = ["### Acceptance suite\n"]
          lines.append(f"- {suite['scenario_count']} scenarios across "
                       f"{len({s['file'] for s in suite['scenarios']})} files")
          lines.append(f"- {len(changed)} introduced or changed by this PR\n")
          lines += [f"  - `{s['id']}`" for s in changed]
          if suite["shallow"]:
              lines.append("\n> **Dating is unreliable**: the checkout is shallow, so every")
              lines.append("> scenario below the graft has been re-dated forward.")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          text = "\n".join(lines) + "\n"
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          else:
              sys.stdout.write(text)

          if suite["shallow"]:
              print("::error title=Shallow checkout::scenario dating is unreliable; "
                    "spec CI needs fetch-depth: 0")
              sys.exit(1)
          PY

      - name: Upload the suite
        uses: actions/upload-artifact@v4
        with:
          name: suite
          path: suite.json

  # =====================================================================
  # ===================  STUB — NOT IMPLEMENTED (v0.2)  =================
  # =====================================================================
  # The three agent reviews from spec/features/spec-pipeline.md. Each step
  # below exits 0 without reviewing anything. They are wired up here so the
  # job graph, permissions and artifact flow are settled before the agents
  # arrive; replace each `echo` with the agent invocation.
  #
  # Until then these checks are PASSING VACUOUSLY. Do not read a green
  # spec-ci as evidence that a spec change was reviewed for coherence,
  # coverage or impact.
  # =====================================================================
  agent-review:
    name: Agent review (STUB)
    runs-on: blacksmith-2vcpu-ubuntu-2204
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This checkout never pushes, so the credential has no reason to
          # outlive it in `.git/config`.
          persist-credentials: false

      - name: Download the suite
        uses: actions/download-artifact@v4
        with:
          name: suite

      # ---- STUB: coherence review (.vellum/agents/spec-reviewer.md, duty 1) ----
      # Real behaviour: does this change contradict the spec tree or any other
      # OPEN spec PR? Does it introduce ambiguity or off-glossary terms?
      # Consolidate findings into one PR review, citing files and lines.
      - name: Coherence review (STUB — always passes)
        run: |
          echo "::warning title=Stub::coherence review is not implemented (v0.2)"
          echo "STUB: would review spec/ for contradictions against the tree and open spec PRs"

      # ---- STUB: coverage review (.vellum/agents/spec-reviewer.md, duty 2) ----
      # Real behaviour: every behavioral change carries scenarios that pin it
      # down. "Be strict enough to be annoying." The changed set this review
      # reasons over is suite.json's scenarios dated at the PR head, i.e.
      # `version == spec_version`.
      - name: Coverage review (STUB — always passes)
        run: |
          echo "::warning title=Stub::coverage review is not implemented (v0.2)"
          echo "STUB: would require a scenario for every changed behavioral statement"

      # ---- STUB: impact report (.vellum/agents/spec-reviewer.md, duty 3) ----
      # Real behaviour: affected areas, predicted product repos, rough size,
      # risks; check spec:redefining declarations BOTH ways (labelled-but-routine
      # and unlabelled-but-redefining).
      - name: Impact report (STUB — always passes)
        run: |
          echo "::warning title=Stub::impact report is not implemented (v0.2)"
          echo "STUB: would post affected areas, predicted repos, size and risk"

  # =====================================================================
  # Backpressure — spec/features/spec-pipeline.md: "past the configured cap of
  # unshipped spec versions, further spec merges are blocked until
  # implementation catches up." This was a stub that echoed and exited 0; it is
  # `vellum backpressure` now, which counts ledger records that are neither
  # shipped nor superseded and exits non-zero at or past `budgets.divergence_cap`
  # in .vellum/config.yaml. Scenario: `@id:backpressure-blocks-merge`.
  #
  # ------------------------------------------------------------------
  # REPORTING, NOT YET BLOCKING — and this is one line to change.
  #
  # `continue-on-error: true` below is not caution about the command. It is a
  # fact about the ledger it reads: nothing has ever set a record to `shipped`,
  # so every record in the intent repo counts as unshipped. Arming the gate
  # before there is any way to relieve it would block every spec merge in the
  # repository, including the one that lands the relief. That is not
  # backpressure, it is a deadlock, and a red check nobody can clear is how a
  # team learns to ignore red.
  #
  # Wave F (waviisoft/vellum#14) built the relief and did NOT arm the gate,
  # because the gate is still deadlocked. Re-measured on `main`, not carried
  # over from the note above:
  #
  #   * 14 records, every one of them `approved`, against a cap of 3.
  #     `vellum backpressure . --strict` exits 1 with "Divergence window: 14 of 3".
  #   * `ledger/releases.yaml` still has `cuts: []` and
  #     `channels.production.spec_conformed: null`. A cut relieves the window —
  #     `vellum release cut --suite-result green` writes `state: shipped` onto
  #     every wave it names — but no cut has been recorded here, and this wave
  #     lands in the *product* repo, which holds no intent-repo credentials and
  #     so cannot record one.
  #   * A green cut over the ledger as it stands is REFUSED anyway, and that is
  #     the sharper half: `release cut` will not promote a wave whose record has
  #     not reached `verified` or `shipped`, because promotion writes `shipped`
  #     — one of `chain.CERTIFIABLE_STATES` — and a cut that shipped an
  #     `approved` wave would satisfy `vellum ledger verify`'s own
  #     `uncertified-wave` check by having been made. All 14 records are
  #     `approved`, so the refusal fires on all 14.
  #
  # So relief needs two things that are the orchestrator's and not this repo's:
  # the records advancing to `verified`, and a cut recorded on the intent repo.
  # Both were verified to work, on a scratch clone of this repo's own main: with
  # the 14 records advanced to `verified`, one `vellum release cut --channel
  # production --suite-result green` naming all 14 takes the window from
  # "14 of 3, BLOCKED" to "0 of 3, OK" and moves `spec_conformed` to a60b3195.
  #
  # So the check goes on running for real, reporting for real, and not blocking.
  # **Delete the `continue-on-error` line to arm it** — once a real cut has been
  # recorded and `vellum backpressure . --strict` exits 0 against this repo's
  # `main`. Run it first; do not arm on the strength of this comment. Nothing
  # else needs to change.
  #
  # Arming is TRACKED, not merely intended: `waviisoft/vellum-intent#41` stays
  # OPEN, now behind a recorded cut rather than behind the machinery to record
  # one. This comment is not the only record of the hold.
  # ------------------------------------------------------------------
  backpressure:
    name: Backpressure check (reporting only)
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@v4
        with:
          # The window is counted from `ledger/`, which a shallow clone has in
          # full — but `fetch-depth: 0` stays, because it is the shape every
          # job in this pipeline is checked out with and a per-job exception is
          # how one of them ends up shallow by accident.
          fetch-depth: 0
          # Nothing here pushes, and this job runs on `pull_request` in a
          # workspace holding the PR's merged tree. Leaving the job token in
          # `.git/config` buys nothing and widens what a future step in this
          # job could reach.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A NOTICE, NOT A GATE — this step used to `exit 1` on an empty secret.
      # VELLUM_TOKEN is optional now: the CLI checkout below falls back to the
      # caller's own `github.token`, which reads waviisoft/vellum once that repo
      # is public. What is left worth saying is WHICH of the two the run used,
      # because a checkout that 404s against a repo that is still private is
      # otherwise an opaque failure two steps further down.
      #
      # The secret reaches this body through `env:` and is only ever tested for
      # emptiness — never echoed, never interpolated. `required: false` does not
      # make this step redundant: it catches a caller that omits the key, and
      # never an empty one, which is the case this reports.
      - name: Say whether VELLUM_TOKEN was supplied
        env:
          VELLUM_TOKEN: ${{ secrets.VELLUM_TOKEN }}
        run: |
          if [ -z "$VELLUM_TOKEN" ]; then
            echo "::notice title=No VELLUM_TOKEN::no VELLUM_TOKEN — checking out waviisoft/vellum without a token; this works once the repo is public"
          else
            echo "VELLUM_TOKEN was supplied; the CLI checkout uses it rather than the caller's github.token."
          fi

      - name: Check out the vellum CLI
        uses: actions/checkout@v4
        with:
          repository: waviisoft/vellum
          ref: ${{ inputs.vellum-ref }}
          # The secret when the caller passed one, the caller's own job token
          # otherwise. `actions/checkout` reads `token` as a REQUIRED input, so
          # an empty value is not "fall back to the default" — it is
          # "Input required and not supplied", before the clone is attempted.
          # The `||` supplies the default explicitly. It is written here, in
          # `with:`, rather than as two checkout steps with opposite `if:`
          # conditions, because the `secrets` context is not available in an
          # `if:` at all — that shape needs the secret laundered through a step
          # output first, and a mis-set output silently runs both checkouts or
          # neither. Both values are registered as secrets and masked in the log.
          token: ${{ secrets.VELLUM_TOKEN || github.token }}
          path: vellum-cli
          # Whichever credential the line above resolved to has no business
          # outliving the checkout that needed it, least of all in a workspace
          # whose root is a pull request's merged tree.
          persist-credentials: false

      - name: Install the vellum CLI
        run: pip install --quiet ./vellum-cli

      # `--strict` refuses to answer when a ledger file cannot be read, rather
      # than reporting it and counting a window that is narrower than the
      # truth. On a gate that is the right direction: "I could not read three
      # records" must not arrive as "there is room for three more versions".
      #
      # This measures the LANDED half of the window only. The spec counts
      # approved-but-unlanded spec PRs alongside it; those are forge state, and
      # `--pending <n>` is where that count goes once something here can see it.
      #
      # Remove `continue-on-error` to make this block a merge. See above, and
      # `waviisoft/vellum-intent#41` for when.
      #
      # `set -o pipefail` is load-bearing and not style: without it the step's
      # status is `tee`'s, which is always 0, so deleting the
      # `continue-on-error` line above would arm a gate that can never close.
      # A guard that silently does nothing is worse than no guard.
      - name: Divergence cap
        continue-on-error: true
        run: |
          set -o pipefail
          vellum backpressure . --strict | tee -a "$GITHUB_STEP_SUMMARY"
